{% extends "base.html" %}

{% block title %} Pridať nového hráča {% endblock %}

{% block body %}
<div class="container mt-4">
    <h2 class="text-center">Pridať hráča do kategórie: {{ category_name }}</h2>

    <form method="POST" action="" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-primary">Odoslať formulár</button>
    </form>
</div>
{% endblock %}
